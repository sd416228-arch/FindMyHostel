{% extends 'user_base.html' %}

{% block title %}Edit Profile - FindMy Hostel{% endblock %}

{% block page_title %}Edit Profile{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">Edit Profile</h2>
                
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <!-- Email (Read-only) -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" value="{{ user.email }}" disabled>
                    </div>
                    
                    <!-- Phone -->
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" name="phone" value="{{ user.phone|default:'' }}" maxlength="10" pattern="[0-9]{10}" title="Phone number must be exactly 10 digits">
                    </div>
                    
                    <!-- Profile Picture -->
                    <div class="mb-3">
                        <label for="profile_picture" class="form-label">Profile Picture</label>
                        <input type="file" class="form-control" id="profile_picture" name="profile_picture" accept="image/*">
                        {% if user.profile_picture %}
                            <div class="mt-2">
                                <img src="{{ user.profile_picture.url }}" alt="Profile" style="max-width: 100px; height: auto; border-radius: 8px;">
                            </div>
                        {% endif %}
                    </div>
                    
                    <hr>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save"></i> Save Changes
                        </button>
                        <a href="{% if is_owner_portal %}{% url 'accounts:owner_profile' %}{% else %}{% url 'accounts:profile' %}{% endif %}" class="btn btn-outline-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
